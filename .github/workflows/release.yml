name: Release

# Legt zu einem Tag das Paket für den lokalen Betrieb an und veröffentlicht es
# als GitHub-Release. Titel und Text stammen aus CHANGELOG.md; beim manuellen
# Start lassen sie sich überschreiben.
#
# Ein Tag-Push veröffentlicht damit von selbst. Beim Start von Hand darf der
# Tag auch noch fehlen: Der Lauf bestimmt die Fassung dann aus package.json des
# gebauten Stands und setzt den Tag selbst - aber erst, wenn Build, Prüfung und
# Tests durchgelaufen sind. Zum Veröffentlichen genügt damit ein Start dieses
# Workflows.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag der Fassung, z. B. v4.41.0 (leer = aus package.json)"
        required: false
      ref:
        description: "Stand, der gebaut wird (leer = der Tag bzw. der gewählte Zweig)"
        required: false
      title:
        description: "Titel (leer = aus CHANGELOG.md)"
        required: false
      notes:
        description: "Release-Text (leer = Abschnitt aus CHANGELOG.md)"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Paket bauen und veröffentlichen
    # Das Paketskript ist für Windows-PowerShell geschrieben und wird über
    # npm run release:package genauso aufgerufen wie bei einer Auslieferung
    # vom Arbeitsplatz aus.
    runs-on: windows-latest
    steps:
      # Gebaut wird der Tag. Trägt ein Tag die Bauwerkzeuge noch nicht - etwa
      # der erste, der vor diesem Workflow entstanden ist -, benennt „ref“
      # stattdessen den Stand, der sie enthält. Der Abgleich mit package.json
      # im nächsten Schritt stellt sicher, dass er dieselbe Fassung trägt.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Enthält npm run verify: Build, Strukturprüfung und Tests. Schlägt eine
      # der Prüfungen fehl, entsteht keine Veröffentlichung.
      #
      # Ausdrücklich in Windows PowerShell: Der Standard von Actions ist
      # PowerShell 7, und das Paketskript startet seinerseits powershell.exe.
      # Die geerbte Modulsuche der 7er lässt die 5.1 dann ihre eigenen
      # Standardbefehle nicht mehr finden - Get-FileHash etwa.
      - name: Paket bauen
        shell: powershell
        run: npm run release:package

      # Ohne Tag-Eingabe nennt package.json die Fassung. Ob Tag, package.json
      # und CHANGELOG.md dieselbe Fassung meinen, prüft release-notes.mjs im
      # übernächsten Schritt ohnehin.
      - name: Fassung bestimmen
        id: fassung
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = "v" + (node -p "require('./package.json').version") }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Veröffentlicht wird $tag."

      # Getaggt wird erst nach bestandener Prüfung. Ein vorhandener Tag bleibt
      # unangetastet: Zeigt er auf denselben Stand, ist nichts zu tun; zeigt er
      # woandershin, bricht der Lauf ab, statt Geschichte umzuschreiben.
      - name: Tag setzen
        env:
          RELEASE_TAG: ${{ steps.fassung.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $head = git rev-parse HEAD
          $zeile = git ls-remote --tags origin "refs/tags/$tag"
          if ($zeile) {
            $vorhanden = ($zeile -split "\s+")[0]
            if ($vorhanden -ne $head) {
              Write-Error "Der Tag $tag zeigt auf $vorhanden, gebaut wurde $head."
              exit 1
            }
            Write-Host "Der Tag $tag steht bereits auf diesem Stand."
            exit 0
          }
          git tag $tag
          git push origin $tag

      - name: Titel und Text bestimmen
        id: notes
        env:
          RELEASE_TAG: ${{ steps.fassung.outputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node tools/release-notes.mjs $env:RELEASE_TAG release-notes.md

      - name: Veröffentlichung anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_ASSET: ${{ steps.notes.outputs.asset }}
        run: >
          gh release create $env:RELEASE_TAG $env:RELEASE_ASSET
          --title $env:RELEASE_TITLE
          --notes-file release-notes.md
          --verify-tag
          --latest
