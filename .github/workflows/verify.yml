name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Build, Strukturprüfung und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Der ausgelieferte Stand kommt ohne Abhängigkeiten aus - npm run verify
      # braucht deshalb kein npm ci und läuft an jedem Arbeitsplatz, an dem
      # node steht.
      - name: Build, Strukturprüfung und Tests
        run: npm run verify

      # app.js, styles.css, index.html, app.html, project-meta.js und
      # state-schema.js werden erzeugt UND eingecheckt. Wer eine der erzeugten
      # Dateien direkt bearbeitet, verliert die Änderung beim nächsten Build.
      # Nach dem Build darf deshalb keine Abweichung übrig bleiben.
      - name: Erzeugte Dateien stimmen mit den Quellen überein
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Die erzeugten Dateien weichen von den Quellen in src/ ab. Bitte 'npm run build' ausführen und das Ergebnis mitcommitten."
            exit 1
          fi

      # Der Server hat eigene Abhängigkeiten, node --check braucht sie nicht.
      - name: Serverquellen prüfen
        run: npm run check --prefix server

      # Ab hier mit Entwicklungswerkzeugen. Sie gehören nicht zum
      # ausgelieferten Stand und stehen deshalb hinter npm run verify: Was
      # oben grün ist, ist auch ohne sie grün.
      - name: Entwicklungswerkzeuge holen
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Regelprüfung
        run: npm run lint

      # Alle übrigen Tests laufen ohne Browser. Dieser eine startet TeO
      # wirklich - ohne ihn bliebe ungeprüft, ob die Oberfläche überhaupt
      # hochkommt.
      - name: Browser holen
        run: npx playwright install --with-deps chromium

      - name: Rauchtest im Browser
        run: node --test tests/browser-smoke.test.mjs
